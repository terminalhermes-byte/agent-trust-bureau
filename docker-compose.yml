version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_trust_bureau
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agent_trust_bureau
      REQUIRE_AUTH: "false"
      ENVIRONMENT: development
      WEBHOOK_ASYNC: "true"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: scripts/start-worker.sh
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agent_trust_bureau
      ENVIRONMENT: development
      WEBHOOK_WORKER_POLL_SECONDS: "2"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
