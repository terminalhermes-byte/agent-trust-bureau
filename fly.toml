app = "agent-trust-bureau"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  REQUIRE_AUTH = "true"
  PORT = "8010"
  SCORE_RATE_LIMIT_PER_MINUTE = "30"
  WEBHOOK_ASYNC = "true"

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      interval = "15s"
      timeout = "5s"
      grace_period = "10s"
      method = "GET"
      path = "/health"

# ---------------------------------------------------------------------------
# Webhook worker — run as a separate Fly Machine (process group):
#   fly machine run . --config fly.toml \
#     -e WEBHOOK_WORKER_POLL_SECONDS=2 \
#     --entrypoint scripts/start-worker.sh
#
# Or use Fly's [processes] feature:
#   [processes]
#     web = "scripts/start.sh"
#     worker = "scripts/start-worker.sh"
# ---------------------------------------------------------------------------
